<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DİZİNATİON+</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b0b0f;color:#fff}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 32px;
  background:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 60%,transparent 100%);
}
.logo{color:#e50914;font-weight:800;font-size:28px}
.wikiBtn{
  background:#fff;color:#000;border:0;padding:8px 14px;border-radius:6px;
  cursor:pointer;font-weight:600;
}

/* APP */
.hero{
  height:62vh;
  display:flex;
  align-items:flex-end;
  padding:40px;
  background-image:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.2)),url('https://picsum.photos/1600/800?blur=2');
  background-size:cover;background-position:center;
}
.hero h1{font-size:42px;margin:0 0 10px}
.hero p{max-width:520px;opacity:.9;margin:0 0 16px}
.hero button{background:#e50914;border:0;color:#fff;padding:12px 18px;border-radius:6px;cursor:pointer;font-weight:600}

.container{padding:24px 32px}
.section-title{font-size:20px;margin:10px 0 12px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}

.card{
  min-width:180px;height:260px;border-radius:12px;
  background-size:cover;background-position:center;
  position:relative;cursor:pointer;transition:.25s;
}
.card:hover{transform:scale(1.08);box-shadow:0 10px 30px rgba(0,0,0,.7)}
.card .label{
  position:absolute;left:10px;bottom:10px;
  background:rgba(0,0,0,.7);
  padding:6px 10px;border-radius:6px;font-size:13px;
}

.coming-soon{
  position:absolute;bottom:35px;left:10px;
  color:red;font-size:14px;font-weight:bold;
}

/* MODAL */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:none;align-items:center;justify-content:center;z-index:30;
}
.modal{
  width:min(1000px,92vw);
  max-height:86vh;
  overflow:auto;
  background:#111;
  border-radius:14px;
  padding:18px;
  position:relative;
}
.modal h2{margin:0 0 10px}

.episodes{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
}
.ep{
  background:#1a1a22;border-radius:8px;padding:10px;text-align:center;cursor:pointer;
}
.ep:hover{background:#262632}

.player{margin-top:14px}
iframe{width:100%;height:500px;border-radius:10px}
.close{position:absolute;right:18px;top:14px;font-size:22px;cursor:pointer}

/* OKUMA SAYFASI */
.page{
  background:white;
  color:black;
  padding:20px;
  border-radius:10px;
  min-height:200px;
}
</style>
</head>

<body>

<header>
  <div class="logo">DİZİNATİON+</div>
  <button class="wikiBtn" onclick="toggleWiki()">Wikipedia</button>
</header>

<div id="app">

<div class="hero">
  <div>
    <h1>Diziler</h1>
    <p>Dünyanın en iyi dizi sitesi.</p>
    <button onclick="openShow(0)">▶ Hemen İzle</button>
  </div>
</div>

<div class="container">
  <div class="section-title">Kütüphane</div>
  <div class="row" id="showsRow"></div>

  <!-- 📚 KİTAPLAR -->
  <div class="section-title">📚 Kitaplar</div>
  <div class="row" id="booksRow"></div>
</div>

<!-- DİZİ MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="close" onclick="closeModal()">✖</div>
    <h2 id="showTitle"></h2>
    <div class="episodes" id="episodes"></div>

    <div class="player" id="player" style="display:none;">
      <iframe id="videoFrame" allow="autoplay" allowfullscreen></iframe>
    </div>
  </div>
</div>

<!-- 📖 KİTAP MODAL -->
<div class="overlay" id="bookOverlay">
  <div class="modal">
    <div class="close" onclick="closeBook()">✖</div>
    <h2 id="bookTitle"></h2>

    <div class="page" id="pageContent"></div>

    <div style="margin-top:15px;">
      <button onclick="prevPage()">⬅ Geri</button>
      <button onclick="nextPage()">İleri ➡</button>
    </div>
  </div>
</div>

</div>

<script>

/* ===== DİZİLER (AYNI) ===== */
const shows = [
  { title: 'Haymun Netre', cover: 'https://i.pinimg.com/736x/22/68/fb/2268fbc1b8b7ee30988e1947ac3e77cc.jpg', count: 4 },
  { title: 'Vakkas Remastered', cover: 'https://i.pinimg.com/736x/f0/91/1d/f0911d27b0d9786a56825d064dcc660a.jpg', count: 2 },
  { title: 'Maniac Moruq', cover: 'https://i.pinimg.com/736x/cc/a5/bf/cca5bfa0349935f778e1ad623cf9d6cf.jpg', count: 18 },
  { title: 'Ehlen ve Sehlen', cover: 'https://i.pinimg.com/736x/f6/1b/68/f61b68fb66f7599915e69808065f84ea.jpg', count: 0 },
  { title: 'Kafa Koparanlar', cover: 'https://i.pinimg.com/736x/2e/59/3d/2e593db0d027eeef504e8aa00d3ba305.jpg', count: 0 }
];

/* VIDEO LİNKLERİNE DOKUNMADIM */
const videoLinks = {
  0: ["https://drive.google.com/file/d/1AuLFqTHe_5Ah81BFa5rHXYgXl5XJGmJt/view"]
};

/* DİZİ UI */
const row = document.getElementById('showsRow');

shows.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className='card';
  el.style.backgroundImage=`url('${s.cover}')`;
  el.innerHTML=`<div class="label">${s.title}</div>`;
  el.onclick=()=>openShow(i);
  row.appendChild(el);
});

function openShow(i){
  document.getElementById('overlay').style.display='flex';
}

function closeModal(){
  document.getElementById('overlay').style.display='none';
}

/* ===== KİTAPLAR ===== */
const books = [
  {title:"Karanlık Günlük",cover:"https://picsum.photos/200/300?1",pages:["Sayfa 1","Sayfa 2","Sayfa 3"]},
  {title:"Zihin Labirenti",cover:"https://picsum.photos/200/300?2",pages:["A","B","C"]},
  {title:"Son Mesaj",cover:"https://picsum.photos/200/300?3",pages:["X","Y","Z"]}
];

const booksRow=document.getElementById("booksRow");

books.forEach((b,i)=>{
  const el=document.createElement("div");
  el.className="card";
  el.style.backgroundImage=`url('${b.cover}')`;
  el.innerHTML=`<div class="label">${b.title}</div>`;
  el.onclick=()=>openBook(i);
  booksRow.appendChild(el);
});

let currentBook=0;
let currentPage=0;

function openBook(i){
  currentBook=i;
  currentPage=0;
  document.getElementById("bookOverlay").style.display="flex";
  document.getElementById("bookTitle").innerText=books[i].title;
  showPage();
}

function showPage(){
  document.getElementById("pageContent").innerText=books[currentBook].pages[currentPage];
}

function nextPage(){
  if(currentPage<books[currentBook].pages.length-1){
    currentPage++;
    showPage();
  }
}

function prevPage(){
  if(currentPage>0){
    currentPage--;
    showPage();
  }
}

function closeBook(){
  document.getElementById("bookOverlay").style.display="none";
}

</script>

</body>
</html>

</body>
</html>

</script>

</body>
</html>
